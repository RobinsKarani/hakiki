<rect x="40" y="150" width="360" height="220" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="62" y="188" font-size="20" font-weight="bold">Local browser · React / Vite</text><text x="62" y="225" font-size="16">Select synthetic documents + provider</text><text x="62" y="254" font-size="16">Consent to external inference</text><text x="62" y="283" font-size="16">Plan, actual tool events, findings</text><text x="62" y="312" font-size="16">Sources, draft download, human review</text><rect x="490" y="150" width="620" height="260" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="512" y="188" font-size="20" font-weight="bold">Local backend · Node / TypeScript</text><text x="512" y="225" font-size="16">Agent: model writes a plan and chooses tools</text><text x="512" y="254" font-size="16">MIT TypeScript loop with execution limits</text><text x="512" y="283" font-size="16">Official provider SDKs; fixed model per run</text><text x="512" y="312" font-size="16">Checks source quotes; limits context, tokens and time</text><text x="512" y="341" font-size="16">Local JSON state and timestamped JSONL logs</text><text x="512" y="370" font-size="16">Loopback HTTP with origin and session checks</text><rect x="1200" y="150" width="360" height="290" rx="14" fill="#fff3df" stroke="#c7d6ca" stroke-width="2"/><text x="1222" y="188" font-size="20" font-weight="bold">Selected model inference</text><text x="1222" y="225" font-size="16">Gemini 3.5 Flash Lite · reference run</text><text x="1222" y="254" font-size="16">OpenAI Terra · completed reference run</text><text x="1222" y="283" font-size="16">Groq GPT-OSS 120B · task incomplete</text><text x="1222" y="312" font-size="16">Hosted inference sends selected text out</text><text x="1222" y="341" font-size="16">Local compatible endpoint: full task untested</text><text x="1222" y="370" font-size="16">Loopback /v1 with a tool-response check</text><text x="1222" y="399" font-size="16">No provider key in browser / MCP</text><rect x="490" y="500" width="620" height="115" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="512" y="538" font-size="20" font-weight="bold">Official MCP client SDK · three connections</text><text x="512" y="575" font-size="16">Discover schemas → expose only approved tools</text><text x="512" y="604" font-size="16">Node stdio children; modern / legacy negotiation</text><rect x="40" y="720" width="460" height="240" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="62" y="758" font-size="20" font-weight="bold">Procurement MCP · built here</text><text x="62" y="795" font-size="16">extract_tender_requirements</text><text x="62" y="824" font-size="16">check_bid_completeness</text><text x="62" y="853" font-size="16">write_review_report</text><text x="62" y="882" font-size="16">Exact quotes and hashes; fixed report paths</text><text x="62" y="911" font-size="16">No model-accessible approval or award tool</text><rect x="570" y="720" width="460" height="240" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="592" y="758" font-size="20" font-weight="bold">KenyaLaw MCP · public upstream</text><text x="592" y="795" font-size="16">search_legislation</text><text x="592" y="824" font-size="16">get_akn_document</text><text x="592" y="853" font-size="16">Pinned public checkout, independent server</text><text x="592" y="882" font-size="16">Official Kenyan legal discovery + provision text</text><text x="592" y="911" font-size="16">MCP 2026-07-28 (modern requests)</text><rect x="1100" y="720" width="460" height="240" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="1122" y="758" font-size="20" font-weight="bold">Filesystem MCP · third-party</text><text x="1122" y="795" font-size="16">read_text_file · only exposed file tool</text><text x="1122" y="824" font-size="16">Selected normalized input directory only</text><text x="1122" y="853" font-size="16">Official community implementation</text><text x="1122" y="882" font-size="16">MCP 2025-11-25 (legacy initialization)</text><text x="1122" y="911" font-size="16">Directory filtering is not an OS sandbox</text><rect x="40" y="1060" width="460" height="170" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="62" y="1098" font-size="20" font-weight="bold">Local draft + evidence artifacts</text><text x="62" y="1135" font-size="16">Markdown / JSON findings + legal source inventory</text><text x="62" y="1164" font-size="16">Normalized input + retrieved passages + hashes</text><text x="62" y="1193" font-size="16">Draft frozen to agent; human checks unchanged hash</text><rect x="570" y="1060" width="460" height="170" rx="14" fill="#fff3df" stroke="#c7d6ca" stroke-width="2"/><text x="592" y="1098" font-size="20" font-weight="bold">Kenyan legal sources · network</text><text x="592" y="1135" font-size="16">Official KenyaLaw.org</text><text x="592" y="1164" font-size="16">Public Procurement and Asset Disposal Act</text><text x="592" y="1193" font-size="16">Constitution of Kenya · Article 227</text><text x="592" y="1222" font-size="16">Expression + retrieval date; current law needs review</text><rect x="1100" y="1060" width="460" height="170" rx="14" fill="#ffffff" stroke="#c7d6ca" stroke-width="2"/><text x="1122" y="1098" font-size="20" font-weight="bold">Local document sources</text><text x="1122" y="1135" font-size="16">Fictional or archived ICTA notice excerpt</text><text x="1122" y="1164" font-size="16">Manifest-selected text / Markdown / text-layer PDFs</text><text x="1122" y="1193" font-size="16">Synthetic suppliers; no active tender / personal data</text><rect x="40" y="1320" width="460" height="170" rx="14" fill="#e6f2e9" stroke="#c7d6ca" stroke-width="2"/><text x="62" y="1358" font-size="20" font-weight="bold">Human-review gate · backend enforced</text><text x="62" y="1395" font-size="16">Named reviewer + note; unchanged draft hash</text><text x="62" y="1424" font-size="16">Approve draft / reject / request revision</text><text x="62" y="1453" font-size="16">Separate browser / CLI action, unavailable to model</text><text x="62" y="1482" font-size="16">One local decision record; no procurement action</text>
<text x="570" y="1370" font-size="18" font-weight="bold">What still needs review</text><text x="570" y="1407" font-size="17">Exact quotes identify source text; meaning and legal applicability need human review.</text><text x="570" y="1444" font-size="17">No scheduling or run resume. The selected model stays fixed throughout a run.</text><text x="570" y="1481" font-size="17">Ask organizers to confirm the MIT runtime and hosted open-weight inference.</text><text x="40" y="1535" font-size="15">Arrows show requests, responses or file access. Selected inference and legal sources use HTTP; all other components run locally.</text></g></svg>